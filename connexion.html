<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Z.Éducation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #0369a1;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: #0369a1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #075985;
        }

        .forgot {
            text-align: right;
            margin-top: 12px;
        }

        .forgot a {
            color: #0369a1;
            font-size: 13px;
            text-decoration: none;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
        }

        .register a {
            color: #0369a1;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>Z.Éducation</h1>
                <p>Apprendre • Comprendre • Réussir</p>
            </div>

            <h2>Connexion</h2>

            <p class="subtitle">
                Connecte-toi pour accéder à ton espace d'apprentissage.
            </p>

           <form id="connexion-form">

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Se connecter
                </button>

            </form>

            <div class="forgot">
                <a href="#">Mot de passe oublié ?</a>
            </div>

            <div class="register">
                Pas encore de compte ?
               <a href="inscription.html">Créer un compte</a>
            </div>

        </div>

        <div class="back">
            <a href="index.html">← Retour à l'accueil</a>
        </div>

    </div>
<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://qeiggkbirzrxpikhdzgn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZQPLhmrdkOejL8mS_8B6Vg_LjNcPHOk";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );
</script>
    <script>
document.getElementById("connexion-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("❌ " + error.message);
        return;
    }

   window.location.href = "espace.html";
</body>
</html>
